[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "homeflow-ios"
version = "0.1.0"
description = "Local-first iPhone Home Screen organization with a browser preview"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
dependencies = ["pymobiledevice3==11.36.0", "fastapi==0.146.0", "uvicorn==0.54.0"]

[project.optional-dependencies]
test = ["httpx2==2.14.0"]

[project.scripts]
homeflow = "homeflow.server:main"

[tool.setuptools.package-data]
homeflow = ["web/*"]

[tool.setuptools.packages.find]
include = ["homeflow*"]
